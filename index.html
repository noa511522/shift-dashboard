<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shift Sync Dashboard Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+JP:wght@500;700;900&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.14) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(168, 85, 247, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.10) 0px, transparent 50%),
                radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 24px 24px;
            background-attachment: fixed;
        }
        .dark body {
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.22) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.18) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.12) 0px, transparent 50%),
                radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 24px 24px;
            background-attachment: fixed;
        }
        .glass-card { 
            background: rgba(255, 255, 255, 0.92); 
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08), 0 0 1px 1px rgba(15, 23, 42, 0.05);
        }
        .dark .glass-card { 
            background: rgba(15, 23, 42, 0.85); 
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5), 0 0 1px 1px rgba(255, 255, 255, 0.08);
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.4); border-radius: 9999px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen antialiased p-4 sm:p-6 lg:p-8 transition-colors duration-300">

    <div class="max-w-7xl mx-auto space-y-6">
        <header class="glass-card rounded-3xl p-5 sm:p-6 flex flex-col xl:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-600 via-violet-600 to-purple-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30 shrink-0">
                    <i class="fa-solid fa-layer-group text-xl"></i>
                </div>
                <div>
                    <span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase tracking-widest bg-indigo-100 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800">
                        Team Cloud Sync Suite
                    </span>
                    <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-slate-900 dark:text-white mt-0.5">
                        Shift Sync <span class="bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">Dashboard</span>
                    </h1>
                </div>
            </div>

            <div class="flex flex-wrap items-center justify-center gap-2.5">
                <div class="flex items-center bg-slate-100/90 dark:bg-slate-900/90 rounded-2xl p-1 border border-slate-200/80 dark:border-slate-700/80 shadow-inner gap-0.5">
                    <button onclick="changeMonthRelative(-1)" class="w-9 h-9 flex items-center justify-center hover:bg-white dark:hover:bg-slate-800 rounded-xl transition-all text-slate-700 dark:text-slate-200"><i class="fa-solid fa-chevron-left text-xs"></i></button>
                    <select id="selectYear" onchange="changeMonthYear()" class="bg-transparent font-extrabold text-sm px-2 py-1.5 outline-none cursor-pointer">
                        <option value="2026">2026年</option>
                        <option value="2027">2027年</option>
                        <option value="2028">2028年</option>
                    </select>
                    <select id="selectMonth" onchange="changeMonthYear()" class="bg-transparent text-indigo-600 font-extrabold text-sm px-2 py-1.5 outline-none cursor-pointer">
                        <option value="1">1月</option><option value="2">2月</option><option value="3">3月</option><option value="4">4月</option>
                        <option value="5">5月</option><option value="6">6月</option><option value="7">7月</option><option value="8">8月</option>
                        <option value="9">9月</option><option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
                    </select>
                    <button onclick="changeMonthRelative(1)" class="w-9 h-9 flex items-center justify-center hover:bg-white dark:hover:bg-slate-800 rounded-xl transition-all text-slate-700 dark:text-slate-200"><i class="fa-solid fa-chevron-right text-xs"></i></button>
                </div>
                <button onclick="jumpToCurrentMonth()" class="bg-white dark:bg-slate-800 text-xs font-bold px-3.5 py-2.5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm"><i class="fa-solid fa-calendar-day text-indigo-600"></i> 当月へ</button>
                <button onclick="toggleDarkMode()" class="w-10 h-10 flex items-center justify-center rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700"><i id="themeIcon" class="fa-solid fa-moon"></i></button>
                <button onclick="shareToLine()" class="bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-bold px-4 py-2.5 rounded-2xl text-xs sm:text-sm shadow-lg"><i class="fa-brands fa-line text-lg"></i> LINE共有</button>
                <button onclick="openCsvModal()" class="bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-bold px-4 py-2.5 rounded-2xl text-xs sm:text-sm shadow-lg"><i class="fa-solid fa-file-arrow-down"></i> CSV一括</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- Left Summary -->
            <div class="lg:col-span-5 space-y-6">
                <div class="glass-card rounded-3xl p-6 space-y-6">
                    <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-4">
                        <h2 class="text-lg font-black flex items-center gap-2.5">
                            <span class="w-8 h-8 rounded-xl bg-indigo-100 dark:bg-indigo-950 text-indigo-600 flex items-center justify-center"><i class="fa-solid fa-chart-pie text-sm"></i></span>
                            <span id="summaryTitleLabel">2026年11月</span> サマリー
                        </h2>
                        <span id="syncStatusBadge" class="text-[11px] font-bold px-2.5 py-1 rounded-xl bg-slate-100 dark:bg-slate-900 text-slate-500 border border-slate-200 dark:border-slate-800">
                            <i class="fa-solid fa-cloud text-slate-400"></i> 待機中
                        </span>
                    </div>

                    <div class="grid grid-cols-2 gap-3.5">
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 relative overflow-hidden">
                            <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-indigo-500"></div>
                            <span class="text-xs font-bold text-slate-500">総出勤日数</span>
                            <div id="statWorkDays" class="text-2xl font-black text-indigo-600 mt-1">0日</div>
                        </div>
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 relative overflow-hidden">
                            <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-slate-700"></div>
                            <span class="text-xs font-bold text-slate-500">総労働時間</span>
                            <div id="statWorkHours" class="text-2xl font-black mt-1">0h</div>
                        </div>
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 relative overflow-hidden">
                            <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-amber-500"></div>
                            <span class="text-xs font-bold text-slate-500">早番回数</span>
                            <div id="statEarlyCount" class="text-2xl font-black text-amber-500 mt-1">0回</div>
                        </div>
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 relative overflow-hidden">
                            <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-orange-500"></div>
                            <span class="text-xs font-bold text-slate-500">遅番回数</span>
                            <div id="statLateCount" class="text-2xl font-black text-orange-500 mt-1">0回</div>
                        </div>
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 relative overflow-hidden">
                            <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-violet-600"></div>
                            <span class="text-xs font-bold text-slate-500">夜勤回数</span>
                            <div id="statNightCount" class="text-2xl font-black text-violet-600 mt-1">0回</div>
                        </div>
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 relative overflow-hidden">
                            <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-cyan-500"></div>
                            <span class="text-xs font-bold text-slate-500">テレワーク</span>
                            <div id="statTeleworkCount" class="text-2xl font-black text-cyan-500 mt-1">0日</div>
                        </div>
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 relative overflow-hidden">
                            <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-pink-500"></div>
                            <span class="text-xs font-bold text-slate-500">有休取得</span>
                            <div id="statPaidLeave" class="text-2xl font-black text-pink-500 mt-1">0日</div>
                        </div>
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 relative overflow-hidden">
                            <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-emerald-500"></div>
                            <span class="text-xs font-bold text-slate-500">公休・休み</span>
                            <div id="statOffCount" class="text-2xl font-black text-emerald-500 mt-1">0日</div>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5">
                        <div class="text-xs font-extrabold uppercase tracking-wider mb-3"><i class="fa-solid fa-chart-simple text-indigo-500"></i> 構成比バランス</div>
                        <div class="w-full h-[200px] flex justify-center relative"><canvas id="shiftDonutChart"></canvas></div>
                    </div>
                </div>
            </div>

            <!-- Right Table -->
            <div class="lg:col-span-7 space-y-6">
                <div class="glass-card rounded-3xl p-6">
                    <div class="flex justify-between items-center border-b border-slate-200 dark:border-slate-800 pb-4 mb-4">
                        <h2 class="text-lg font-black flex items-center gap-2.5">
                            <span class="w-8 h-8 rounded-xl bg-indigo-100 dark:bg-indigo-950 text-indigo-600 flex items-center justify-center"><i class="fa-solid fa-calendar-days text-sm"></i></span>
                            <span id="tableTitleLabel">2026年11月</span> シフト一覧
                        </h2>
                        <select id="filterType" onchange="renderTable()" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs font-bold rounded-xl px-3.5 py-2 outline-none cursor-pointer shadow-sm">
                            <option value="all">すべてのシフトを表示</option>
                            <option value="未選択">未選択のみ</option>
                            <option value="早（8:00～17:00）">早番のみ</option>
                            <option value="遅（13:00～22:00）">遅番のみ</option>
                            <option value="夜（21:30～8:30）">夜勤のみ</option>
                            <option value="明け">明けのみ</option>
                            <option value="休み">休みのみ</option>
                            <option value="有休">有休のみ</option>
                        </select>
                    </div>

                    <div class="overflow-x-auto max-h-[560px] rounded-2xl border border-slate-200 dark:border-slate-800 shadow-inner bg-white/60 dark:bg-slate-900/40">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead class="bg-slate-100 dark:bg-slate-900 sticky top-0 text-xs uppercase font-extrabold z-10 border-b border-slate-200 dark:border-slate-800">
                                <tr>
                                    <th class="p-3.5">日付</th>
                                    <th class="p-3.5">曜日</th>
                                    <th class="p-3.5">シフト種別 (変更可)</th>
                                </tr>
                            </thead>
                            <tbody id="shiftTableBody" class="divide-y divide-slate-100 dark:divide-slate-800/70 text-xs sm:text-sm"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- CSV Modal -->
    <div id="csvModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-card rounded-3xl p-6 sm:p-8 max-w-md w-full space-y-6 shadow-2xl border border-slate-200 dark:border-slate-800">
            <div class="flex justify-between border-b border-slate-200 dark:border-slate-800 pb-4">
                <h3 class="text-lg font-black"><i class="fa-solid fa-file-arrow-down text-indigo-600"></i> CSVエクスポート範囲</h3>
                <button onclick="closeCsvModal()" class="w-8 h-8 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold mb-1.5">開始日</label>
                        <select id="csvStartDay" class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs font-bold rounded-xl px-3 py-2.5 outline-none"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1.5">終了日</label>
                        <select id="csvEndDay" class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs font-bold rounded-xl px-3 py-2.5 outline-none"></select>
                    </div>
                </div>
                <label class="flex items-center gap-2.5 cursor-pointer bg-slate-100/80 dark:bg-slate-900/80 p-3 rounded-2xl border border-slate-200 dark:border-slate-800">
                    <input type="checkbox" id="csvExcludeOff" checked class="w-4 h-4 text-indigo-600 rounded">
                    <span class="text-xs font-bold">「休み」「有休」をCSVに含めない</span>
                </label>
            </div>
            <div class="flex justify-end gap-3 pt-2">
                <button onclick="closeCsvModal()" class="px-4 py-2.5 rounded-xl bg-slate-200 dark:bg-slate-800 text-xs font-bold">キャンセル</button>
                <button onclick="executeCsvExport()" class="px-5 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-bold shadow-lg">ダウンロード</button>
            </div>
        </div>
    </div>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxz5M4uHAE4suh6X8v-N9S_5phSkv1wHc2cvYlG6gvgV6lbDHLyD6gTfJSsT7CTabfn/exec";
        const shiftTypesList = ["未選択", "早（8:00～17:00）", "遅（13:00～22:00）", "夜（21:30～8:30）", "明け", "早（テレワーク）", "遅（テレワーク）", "夜（テレワーク）", "休み", "有休"];
        const HOLIDAY_MASTER = {
            "2026-11-3": "文化の日", "2026-11-23": "勤労感謝の日"
        };

        function generateDefaultMonthData(year, month) {
            const daysInMonth = new Date(year, month, 0).getDate();
            const weekDays = ["日", "月", "火", "水", "木", "金", "土"];
            let data = [];
            for (let d = 1; d <= daysInMonth; d++) {
                const dateObj = new Date(year, month - 1, d);
                data.push({ day: d, week: weekDays[dateObj.getDay()], holiday: HOLIDAY_MASTER[`${year}-${month}-${d}`] || null, type: "未選択" });
            }
            return data;
        }

        let now = new Date();
        let currentYear = now.getFullYear();
        let currentMonth = now.getMonth() + 1;
        let shiftCache = {};
        let donutChartInstance = null;
        let isLoaded = false;

        function getYearMonthKey(y, m) { return `${y}-${String(m).padStart(2, '0')}`; }

        async function initApp() {
            setSyncStatus("loading", "読込中...");
            try {
                const res = await fetch(GAS_API_URL);
                const data = await res.json();
                shiftCache = {};
                data.forEach(item => {
                    if (!shiftCache[item.yearMonth]) shiftCache[item.yearMonth] = {};
                    shiftCache[item.yearMonth][item.day] = item.type;
                });
                setSyncStatus("synced", "同期完了");
            } catch (err) {
                setSyncStatus("error", "オフライン");
            }
            isLoaded = true;
            renderTable();
        }

        async function saveShiftToCloud(targetY, targetM, day, type) {
            if (!isLoaded) return;
            setSyncStatus("loading", "保存中...");
            try {
                await fetch(GAS_API_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({ yearMonth: getYearMonthKey(targetY, targetM), day: day, type: type })
                });
                setSyncStatus("synced", "同期完了");
            } catch (err) {
                setSyncStatus("error", "保存失敗");
            }
        }

        function setSyncStatus(status, text) {
            const badge = document.getElementById('syncStatusBadge');
            if (status === "loading") {
                badge.className = "text-[11px] font-bold px-2.5 py-1 rounded-xl bg-amber-50 text-amber-600 border border-amber-200 animate-pulse";
                badge.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> ${text}`;
            } else if (status === "synced") {
                badge.className = "text-[11px] font-bold px-2.5 py-1 rounded-xl bg-emerald-50 text-emerald-600 border border-emerald-200";
                badge.innerHTML = `<i class="fa-solid fa-cloud-check"></i> ${text}`;
            } else {
                badge.className = "text-[11px] font-bold px-2.5 py-1 rounded-xl bg-rose-50 text-rose-600 border border-rose-200";
                badge.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> ${text}`;
            }
        }

        function getCurrentShifts() {
            const ymKey = getYearMonthKey(currentYear, currentMonth);
            const defaultData = generateDefaultMonthData(currentYear, currentMonth);
            if (!shiftCache[ymKey]) return defaultData;
            return defaultData.map(item => {
                if (shiftCache[ymKey][item.day]) item.type = shiftCache[ymKey][item.day];
                return item;
            });
        }

        function updateLabels() {
            const labelText = `${currentYear}年${currentMonth}月`;
            document.getElementById('summaryTitleLabel').innerText = labelText;
            document.getElementById('tableTitleLabel').innerText = labelText;
        }

        function changeMonthYear() {
            currentYear = parseInt(document.getElementById('selectYear').value);
            currentMonth = parseInt(document.getElementById('selectMonth').value);
            updateLabels();
            renderTable();
        }

        function changeMonthRelative(dir) {
            currentMonth += dir;
            if (currentMonth > 12) { currentMonth = 1; currentYear++; }
            else if (currentMonth < 1) { currentMonth = 12; currentYear--; }
            document.getElementById('selectYear').value = currentYear;
            document.getElementById('selectMonth').value = currentMonth;
            updateLabels();
            renderTable();
        }

        function jumpToCurrentMonth() {
            const r = new Date();
            currentYear = r.getFullYear();
            currentMonth = r.getMonth() + 1;
            document.getElementById('selectYear').value = currentYear;
            document.getElementById('selectMonth').value = currentMonth;
            updateLabels();
            renderTable();
        }

        function updateShiftType(day, newType) {
            const ymKey = getYearMonthKey(currentYear, currentMonth);
            if (!shiftCache[ymKey]) shiftCache[ymKey] = {};
            if (newType === "未選択") delete shiftCache[ymKey][day];
            else shiftCache[ymKey][day] = newType;

            renderTable();
            saveShiftToCloud(currentYear, currentMonth, day, newType);
        }

        function renderTable() {
            if (!isLoaded) return;
            const tbody = document.getElementById('shiftTableBody');
            const filter = document.getElementById('filterType').value;
            const shifts = getCurrentShifts();
            tbody.innerHTML = '';
            
            shifts.forEach(item => {
                if (filter !== 'all' && !item.type.includes(filter)) return;
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 dark:hover:bg-slate-800/60 transition-colors";
                if (item.holiday || item.week === "日") tr.className += " bg-rose-50/50 dark:bg-rose-950/20";
                else if (item.week === "土") tr.className += " bg-sky-50/50 dark:bg-sky-950/20";

                let optionsHtml = '';
                shiftTypesList.forEach(st => {
                    optionsHtml += `<option value="${st}" ${item.type === st ? 'selected' : ''}>${st}</option>`;
                });

                tr.innerHTML = `
                    <td class="p-3.5 font-extrabold">${currentMonth}月 ${item.day}日</td>
                    <td class="p-3.5 text-slate-500">(${item.week})${item.holiday ? ` <span class="text-rose-600 font-bold">${item.holiday}</span>` : ''}</td>
                    <td class="p-3.5"><select onchange="updateShiftType(${item.day}, this.value)" class="text-xs font-bold px-3 py-1.5 rounded-xl border border-slate-300 dark:border-slate-700 outline-none cursor-pointer">${optionsHtml}</select></td>
                `;
                tbody.appendChild(tr);
            });
            updateSummaryAndChart(shifts);
        }

        function updateSummaryAndChart(shifts) {
            let workDays = 0, workHours = 0, early = 0, late = 0, night = 0, tele = 0, paid = 0, off = 0;
            let counts = { "早": 0, "遅": 0, "夜": 0, "明け": 0, "休み": 0, "有休": 0, "未選択": 0 };

            shifts.forEach(s => {
                if (s.type.includes('早（8:00')) { workDays++; workHours += 8; early++; counts["早"]++; }
                else if (s.type.includes('遅（13:00')) { workDays++; workHours += 8; late++; counts["遅"]++; }
                else if (s.type.includes('夜（21:30')) { workDays++; workHours += 10; night++; counts["夜"]++; }
                else if (s.type.includes('明け')) { counts["明け"]++; }
                else if (s.type.includes('有休')) { paid++; counts["有休"]++; }
                else if (s.type.includes('休み')) { off++; counts["休み"]++; }
                else { counts["未選択"]++; }
                if (s.type.includes('テレワーク')) tele++;
            });

            document.getElementById('statWorkDays').innerText = workDays + "日";
            document.getElementById('statWorkHours').innerText = workHours + "h";
            document.getElementById('statEarlyCount').innerText = early + "回";
            document.getElementById('statLateCount').innerText = late + "回";
            document.getElementById('statNightCount').innerText = night + "回";
            document.getElementById('statTeleworkCount').innerText = tele + "日";
            document.getElementById('statPaidLeave').innerText = paid + "日";
            document.getElementById('statOffCount').innerText = off + "日";

            const ctx = document.getElementById('shiftDonutChart').getContext('2d');
            if (donutChartInstance) donutChartInstance.destroy();
            donutChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['早番', '遅番', '夜勤', '明け', '休み', '有休', '未選択'],
                    datasets: [{ data: [counts["早"], counts["遅"], counts["夜"], counts["明け"], counts["休み"], counts["有休"], counts["未選択"]], backgroundColor: ['#f59e0b', '#f97316', '#4f46e5', '#10b981', '#cbd5e1', '#ec4899', '#94a3b8'] }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { boxWidth: 10, font: { size: 10 } } } }, cutout: '65%' }
            });
        }

        function openCsvModal() {
            const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
            let s = document.getElementById('csvStartDay'), e = document.getElementById('csvEndDay');
            s.innerHTML = ''; e.innerHTML = '';
            for (let i = 1; i <= daysInMonth; i++) {
                s.innerHTML += `<option value="${i}">${i}日</option>`;
                e.innerHTML += `<option value="${i}" ${i === daysInMonth ? 'selected' : ''}>${i}日</option>`;
            }
            document.getElementById('csvModal').classList.remove('hidden');
        }
        function closeCsvModal() { document.getElementById('csvModal').classList.add('hidden'); }

        function executeCsvExport() {
            const startDay = parseInt(document.getElementById('csvStartDay').value);
            const endDay = parseInt(document.getElementById('csvEndDay').value);
            const excludeOff = document.getElementById('csvExcludeOff').checked;
            const shifts = getCurrentShifts().filter(item => item.day >= startDay && item.day <= endDay && item.type !== '未選択' && !(excludeOff && (item.type.includes('休み') || item.type.includes('有休'))));
            
            if (shifts.length === 0) { alert("対象シフトがありません。"); return; }
            let csv = "\uFEFFSubject,Start Date,All Day Event,Description\r\n";
            shifts.forEach(i => { csv += `"[シフト] ${i.type}",${currentYear}/${String(currentMonth).padStart(2,'0')}/${String(i.day).padStart(2,'0')},True,"Sync CSV"\r\n`; });
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `shift_${currentYear}_${currentMonth}.csv`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            closeCsvModal();
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            document.getElementById('themeIcon').className = document.documentElement.classList.contains('dark') ? "fa-solid fa-sun" : "fa-solid fa-moon";
        }

        function shareToLine() {
            window.open(`https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(window.location.href)}`, '_blank');
        }

        window.onload = function() {
            document.getElementById('selectYear').value = currentYear;
            document.getElementById('selectMonth').value = currentMonth;
            updateLabels();
            initApp();
        };
    </script>
</body>
</html>
