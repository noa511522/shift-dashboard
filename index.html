<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Shift Dashboard & Analytics Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif; }
        .glass-effect { background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(16px); }
        .dark .glass-effect { background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(16px); }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen antialiased p-4 sm:p-6 lg:p-8 transition-colors duration-300">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header Section -->
        <header class="glass-effect border border-slate-200/80 dark:border-slate-800/80 rounded-3xl p-6 shadow-xl flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <div class="flex items-center gap-2 text-indigo-600 dark:text-indigo-400 font-bold text-xs uppercase tracking-wider mb-1">
                    <i class="fa-solid fa-sparkles"></i> Team Operation & Shift Sync Pro
                </div>
                <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-600 to-violet-600 dark:from-indigo-400 dark:to-violet-400 bg-clip-text text-transparent">
                    Shift Sync Dashboard Pro
                </h1>
                <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1">
                    土日祝自動色分け・祝日名表示・テレワーク個別対応
                </p>
            </div>

            <!-- Controls & Actions -->
            <div class="flex flex-wrap items-center gap-2 sm:gap-3">
                <!-- Year & Month Selector -->
                <div class="flex items-center bg-slate-100 dark:bg-slate-900 rounded-2xl p-1 border border-slate-200 dark:border-slate-800 shadow-inner">
                    <select id="selectYear" onchange="changeMonthYear()" class="bg-transparent font-bold text-sm px-3 py-2 outline-none cursor-pointer">
                        <option value="2026">2026年</option>
                        <option value="2027">2027年</option>
                        <option value="2028">2028年</option>
                        <option value="2029">2029年</option>
                        <option value="2030">2030年</option>
                    </select>
                    <select id="selectMonth" onchange="changeMonthYear()" class="bg-transparent text-indigo-600 dark:text-indigo-400 font-bold text-sm px-3 py-2 outline-none cursor-pointer">
                        <option value="1">1月</option>
                        <option value="2">2月</option>
                        <option value="3">3月</option>
                        <option value="4">4月</option>
                        <option value="5">5月</option>
                        <option value="6">6月</option>
                        <option value="7">7月</option>
                        <option value="8">8月</option>
                        <option value="9">9月</option>
                        <option value="10">10月</option>
                        <option value="11">11月</option>
                        <option value="12">12月</option>
                    </select>
                </div>

                <!-- Jump to Current Month -->
                <button onclick="jumpToCurrentMonth()" class="bg-slate-200/80 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-semibold px-3.5 py-2.5 rounded-2xl transition-all shadow-sm flex items-center gap-1.5" title="当月にジャンプ">
                    <i class="fa-solid fa-calendar-day"></i> 当月へ戻る
                </button>

                <!-- Theme Toggle -->
                <button onclick="toggleDarkMode()" class="p-2.5 rounded-2xl bg-slate-200/80 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 transition-colors text-slate-600 dark:text-slate-300 shadow-sm" title="モード切替">
                    <i id="themeIcon" class="fa-solid fa-moon"></i>
                </button>

                <button onclick="shareToLine()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-semibold px-4 py-2.5 rounded-2xl text-sm shadow-lg shadow-emerald-500/20 transition-all flex items-center gap-2">
                    <i class="fa-brands fa-line text-lg"></i> LINE共有
                </button>
                <button onclick="bulkRegisterGCal()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2.5 rounded-2xl text-sm shadow-lg shadow-indigo-600/20 transition-all flex items-center gap-2">
                    <i class="fa-solid fa-calendar-check"></i> カレンダー一括登録
                </button>
            </div>
        </header>

        <!-- Main Layout Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Left Side: Monthly Work Summary & Donut Chart (5 Cols) -->
            <div class="lg:col-span-5 space-y-6">
                <div class="glass-effect border border-slate-200/80 dark:border-slate-800/80 rounded-3xl p-6 shadow-xl space-y-6">
                    <h2 class="text-base font-bold flex items-center gap-2">
                        <i class="fa-solid fa-chart-pie text-indigo-600 dark:text-indigo-400"></i> <span id="summaryTitleLabel">2026年11月</span> 月次ワークサマリー
                    </h2>

                    <!-- 4 Summary Metric Cards -->
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-white/60 dark:bg-slate-900/60 border border-slate-200/50 dark:border-slate-800/80 rounded-2xl p-4 shadow-sm">
                            <span class="text-xs text-slate-500 dark:text-slate-400 font-medium">総出勤日数</span>
                            <div id="statWorkDays" class="text-2xl font-extrabold text-indigo-600 dark:text-indigo-400 mt-1">0日</div>
                        </div>
                        <div class="bg-white/60 dark:bg-slate-900/60 border border-slate-200/50 dark:border-slate-800/80 rounded-2xl p-4 shadow-sm">
                            <span class="text-xs text-slate-500 dark:text-slate-400 font-medium">概算総労働時間</span>
                            <div id="statWorkHours" class="text-2xl font-extrabold mt-1">0h</div>
                        </div>
                        <div class="bg-white/60 dark:bg-slate-900/60 border border-slate-200/50 dark:border-slate-800/80 rounded-2xl p-4 shadow-sm">
                            <span class="text-xs text-slate-500 dark:text-slate-400 font-medium">夜勤回数</span>
                            <div id="statNightCount" class="text-2xl font-extrabold mt-1">0回</div>
                        </div>
                        <div class="bg-white/60 dark:bg-slate-900/60 border border-slate-200/50 dark:border-slate-800/80 rounded-2xl p-4 shadow-sm">
                            <span class="text-xs text-slate-500 dark:text-slate-400 font-medium">有休取得</span>
                            <div id="statPaidLeave" class="text-2xl font-extrabold mt-1">0日</div>
                        </div>
                    </div>

                    <!-- Donut Chart Card -->
                    <div class="bg-white/60 dark:bg-slate-900/60 border border-slate-200/50 dark:border-slate-800/80 rounded-2xl p-5 shadow-sm flex flex-col items-center">
                        <div class="w-full max-h-[220px] flex justify-center">
                            <canvas id="shiftDonutChart"></canvas>
                        </div>
                    </div>

                    <!-- Duplicate Guard Reset & Info -->
                    <div class="pt-2 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between">
                        <span class="text-xs text-slate-500 dark:text-slate-400 flex items-center gap-1.5">
                            <i class="fa-solid fa-shield-halved text-emerald-500"></i> 二重登録ガード有効
                        </span>
                        <button onclick="resetRegisteredStatus()" class="text-xs text-rose-500 hover:text-rose-600 font-semibold underline transition-colors">
                            登録履歴リセット
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right Side: Shift Table & Direct Editor (7 Cols) -->
            <div class="lg:col-span-7 space-y-6">
                <div class="glass-effect border border-slate-200/80 dark:border-slate-800/80 rounded-3xl p-6 shadow-xl">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-4">
                        <h2 class="text-base font-bold flex items-center gap-2">
                            <i class="fa-solid fa-calendar-days text-indigo-600 dark:text-indigo-400"></i> シフト一覧 & ダッシュボード直接編集
                        </h2>
                        <select id="filterType" onchange="renderTable()" class="bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs rounded-xl px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer">
                            <option value="all">すべてのシフト</option>
                            <option value="未選択">未選択</option>
                            <option value="早（8:00～17:00）">早番</option>
                            <option value="遅（13:00～22:00）">遅番</option>
                            <option value="夜（21:30～8:30）">夜勤</option>
                            <option value="明け">明け</option>
                            <option value="早（テレワーク）">早(テレワーク)</option>
                            <option value="遅（テレワーク）">遅(テレワーク)</option>
                            <option value="夜（テレワーク）">夜(テレワーク)</option>
                            <option value="休み">休み</option>
                            <option value="有休">有休</option>
                        </select>
                    </div>

                    <div class="overflow-x-auto max-h-[520px] rounded-2xl border border-slate-200 dark:border-slate-800 shadow-inner">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead class="bg-slate-50 dark:bg-slate-900/90 sticky top-0 text-slate-600 dark:text-slate-300 text-xs uppercase font-semibold z-10 backdrop-blur-md">
                                <tr>
                                    <th class="p-3.5">日付</th>
                                    <th class="p-3.5">曜日</th>
                                    <th class="p-3.5">シフト種別 (変更可)</th>
                                    <th class="p-3.5 text-center">Googleカレンダー</th>
                                </tr>
                            </thead>
                            <tbody id="shiftTableBody" class="divide-y divide-slate-100 dark:divide-slate-800/60 text-slate-700 dark:text-slate-200 text-xs sm:text-sm">
                                <!-- Dynamic Render -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        const shiftTypesList = [
            "未選択",
            "早（8:00～17:00）",
            "遅（13:00～22:00）",
            "夜（21:30～8:30）",
            "明け",
            "早（テレワーク）",
            "遅（テレワーク）",
            "夜（テレワーク）",
            "休み",
            "有休"
        ];

        // 簡易日本の祝日判定ロジック (2026年〜2030年対応)
        function getJapaneseHoliday(year, month, day) {
            const d = new Date(year, month - 1, day);
            const w = d.getDay();

            if (month === 1 && day === 1) return "元日";
            if (month === 2 && day === 11) return "建国記念の日";
            if (month === 2 && day === 23) return "天皇誕生日";
            if (month === 4 && day === 29) return "昭和の日";
            if (month === 5 && day === 3) return "憲法記念日";
            if (month === 5 && day === 4) return "みどりの日";
            if (month === 5 && day === 5) return "こどもの日";
            if (month === 7 && day === 20 && year === 2026) return "海の日";
            if (month === 8 && day === 11) return "山の日";
            if (month === 9 && day === 23) return "秋分の日";
            if (month === 10 && day === 10 && year === 2026) return "スポーツの日";
            if (month === 11 && day === 3) return "文化の日";
            if (month === 11 && day === 23) return "勤労感謝の日";

            if (month === 3) {
                let vernalEquinox = (year === 2026 || year === 2030) ? 20 : 21;
                if (day === vernalEquinox) return "春分の日";
            }

            let weekNum = Math.ceil(day / 7);
            if (month === 1 && w === 1 && weekNum === 2) return "成人の日";
            if (month === 7 && w === 1 && weekNum === 3 && year !== 2026) return "海の日";
            if (month === 9 && w === 1 && weekNum === 3) return "敬老の日";
            if (month === 10 && w === 1 && weekNum === 2 && year !== 2026) return "スポーツの日";

            if (w === 1) {
                const prevDay = new Date(year, month - 1, day - 1);
                if (getJapaneseHoliday(year, prevDay.getMonth() + 1, prevDay.getDate())) {
                    return "振替休日";
                }
            }

            return null;
        }

        function generateDefaultMonthData(year, month) {
            const daysInMonth = new Date(year, month, 0).getDate();
            const weekDays = ["日", "月", "火", "水", "木", "金", "土"];
            
            let data = [];
            for (let d = 1; d <= daysInMonth; d++) {
                const dateObj = new Date(year, month - 1, d);
                const w = weekDays[dateObj.getDay()];
                const holidayName = getJapaneseHoliday(year, month, d);
                data.push({ day: d, week: w, holiday: holidayName, type: "未選択" });
            }
            return data;
        }

        const now = new Date();
        let currentYear = now.getFullYear();
        let currentMonth = now.getMonth() + 1;
        let donutChartInstance = null;

        function getStorageKey() {
            return `shifts_${currentYear}_${currentMonth}`;
        }

        function getRegisteredKey() {
            return `registered_${currentYear}_${currentMonth}`;
        }

        function getCurrentShifts() {
            const stored = localStorage.getItem(getStorageKey());
            if (stored) {
                return JSON.parse(stored);
            }
            const initial = generateDefaultMonthData(currentYear, currentMonth);
            localStorage.setItem(getStorageKey(), JSON.stringify(initial));
            return initial;
        }

        function getRegisteredIds() {
            const stored = localStorage.getItem(getRegisteredKey());
            return stored ? JSON.parse(stored) : [];
        }

        function saveRegisteredIds(ids) {
            localStorage.setItem(getRegisteredKey(), JSON.stringify(ids));
        }

        function changeMonthYear() {
            currentYear = parseInt(document.getElementById('selectYear').value);
            currentMonth = parseInt(document.getElementById('selectMonth').value);
            document.getElementById('summaryTitleLabel').innerText = `${currentYear}年${currentMonth}月`;
            renderTable();
            updateSummaryAndChart();
        }

        function jumpToCurrentMonth() {
            const realNow = new Date();
            currentYear = realNow.getFullYear();
            currentMonth = realNow.getMonth() + 1;
            
            document.getElementById('selectYear').value = currentYear;
            document.getElementById('selectMonth').value = currentMonth;
            document.getElementById('summaryTitleLabel').innerText = `${currentYear}年${currentMonth}月`;
            
            renderTable();
            updateSummaryAndChart();
        }

        function updateShiftType(day, newType) {
            let shifts = getCurrentShifts();
            const idx = shifts.findIndex(s => s.day === day);
            if (idx !== -1) {
                shifts[idx].type = newType;
                localStorage.setItem(getStorageKey(), JSON.stringify(shifts));
                renderTable();
                updateSummaryAndChart();
            }
        }

        function renderTable() {
            const tbody = document.getElementById('shiftTableBody');
            const filter = document.getElementById('filterType').value;
            const shifts = getCurrentShifts();
            const registeredIds = getRegisteredIds();
            
            tbody.innerHTML = '';
            
            shifts.forEach(item => {
                if (filter !== 'all' && !item.type.includes(filter)) return;

                const shiftId = `${currentYear}-${String(currentMonth).padStart(2, '0')}-${String(item.day).padStart(2, '0')}`;
                const isRegistered = registeredIds.includes(shiftId);

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50/80 dark:hover:bg-slate-800/40 transition-colors";
                
                let rowBgClass = "";
                let weekColorClass = "text-slate-500 dark:text-slate-400";
                
                if (item.holiday) {
                    rowBgClass = "bg-rose-50/50 dark:bg-rose-950/20";
                    weekColorClass = "text-rose-600 dark:text-rose-400 font-bold";
                } else if (item.week === "日") {
                    rowBgClass = "bg-rose-50/30 dark:bg-rose-950/10";
                    weekColorClass = "text-rose-500 dark:text-rose-400 font-bold";
                } else if (item.week === "土") {
                    rowBgClass = "bg-sky-50/30 dark:bg-sky-950/10";
                    weekColorClass = "text-sky-600 dark:text-sky-400 font-bold";
                }

                if (rowBgClass) {
                    tr.className += ` ${rowBgClass}`;
                }

                let weekDisplay = `(${item.week})`;
                if (item.holiday) {
                    weekDisplay = `<span class="inline-flex items-center gap-1"><span class="${weekColorClass}">( ${item.week} )</span> <span class="text-[10px] bg-rose-100 text-rose-700 dark:bg-rose-900/60 dark:text-rose-300 px-1.5 py-0.5 rounded-md font-semibold">${item.holiday}</span></span>`;
                }

                let optionsHtml = '';
                shiftTypesList.forEach(st => {
                    const selected = item.type === st ? 'selected' : '';
                    optionsHtml += `<option value="${st}" ${selected}>${st}</option>`;
                });

                let badgeClass = "bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300";
                if(item.type.includes('早（8:00')) badgeClass = "bg-amber-100 text-amber-800 border border-amber-200 dark:bg-amber-950/50 dark:text-amber-300 dark:border-amber-800";
                else if(item.type.includes('遅（13:00')) badgeClass = "bg-orange-100 text-orange-800 border border-orange-200 dark:bg-orange-950/50 dark:text-orange-300 dark:border-orange-800";
                else if(item.type.includes('夜（21:30')) badgeClass = "bg-indigo-100 text-indigo-800 border border-indigo-200 dark:bg-indigo-950/50 dark:text-indigo-300 dark:border-indigo-800";
                else if(item.type.includes('明け')) badgeClass = "bg-emerald-100 text-emerald-800 border border-emerald-200 dark:bg-emerald-950/50 dark:text-emerald-300 dark:border-emerald-800";
                else if(item.type.includes('テレワーク')) badgeClass = "bg-cyan-100 text-cyan-800 border border-cyan-200 dark:bg-cyan-950/50 dark:text-cyan-300 dark:border-cyan-800";
                else if(item.type.includes('有休')) badgeClass = "bg-pink-100 text-pink-800 border border-pink-200 dark:bg-pink-950/50 dark:text-pink-300 dark:border-pink-800";
                else if(item.type.includes('休み')) badgeClass = "bg-slate-200 text-slate-600 dark:bg-slate-700 dark:text-slate-300";

                tr.innerHTML = `
                    <td class="p-3.5 font-semibold">${currentMonth}月 ${item.day}日</td>
                    <td class="p-3.5 ${weekColorClass}">${weekDisplay}</td>
                    <td class="p-3.5">
                        <select onchange="updateShiftType(${item.day}, this.value)" class="text-xs font-semibold px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 outline-none focus:ring-2 focus:ring-indigo-500 ${badgeClass} cursor-pointer shadow-sm">
                            ${optionsHtml}
                        </select>
                    </td>
                    <td class="p-3.5 text-center">
                        ${item.type === '未選択' ? 
                            `<span class="text-xs text-slate-400 dark:text-slate-500">-</span>` :
                            (isRegistered ? 
                                `<span class="inline-flex items-center gap-1 px-2.5 py-1 bg-emerald-50 text-emerald-600 dark:bg-emerald-950/40 dark:text-emerald-400 rounded-lg text-xs font-semibold border border-emerald-200 dark:border-emerald-800">
                                    <i class="fa-solid fa-check-circle"></i> 登録済
                                 </span>` :
                                `<button onclick="registerSingle('${shiftId}', '${item.type}')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 text-xs font-semibold transition-all shadow-sm rounded-xl flex items-center justify-center gap-1 mx-auto">
                                    <i class="fa-regular fa-calendar-plus"></i> 追加
                                 </button>`
                            )
                        }
                    </td>
                `;
                tbody.appendChild(tr);
            });

            updateSummaryAndChart();
        }

        function updateSummaryAndChart() {
            const shifts = getCurrentShifts();
            
            let workDays = 0;
            let workHours = 0;
            let nightCount = 0;
            let paidLeaveCount = 0;

            let counts = { "未選択": 0, "早": 0, "遅": 0, "夜": 0, "明け": 0, "早テレ": 0, "遅テレ": 0, "夜テレ": 0, "休み": 0, "有休": 0 };

            shifts.forEach(s => {
                if(s.type.includes('早（8:00')) { workDays++; workHours += 8; counts["早"]++; }
                else if(s.type.includes('遅（13:00')) { workDays++; workHours += 8; counts["遅"]++; }
                else if(s.type.includes('夜（21:30')) { workDays++; workHours += 9; nightCount++; counts["夜"]++; }
                else if(s.type.includes('早（テレワーク）')) { workDays++; workHours += 8; counts["早テレ"]++; }
                else if(s.type.includes('遅（テレワーク）')) { workDays++; workHours += 8; counts["遅テレ"]++; }
                else if(s.type.includes('夜（テレワーク）')) { workDays++; workHours += 9; nightCount++; counts["夜テレ"]++; }
                else if(s.type.includes('明け')) { counts["明け"]++; }
                else if(s.type.includes('有休')) { paidLeaveCount++; counts["有休"]++; }
                else if(s.type.includes('休み')) { counts["休み"]++; }
                else { counts["未選択"]++; }
            });

            document.getElementById('statWorkDays').innerText = workDays + "日";
            document.getElementById('statWorkHours').innerText = workHours + "h";
            document.getElementById('statNightCount').innerText = nightCount + "回";
            document.getElementById('statPaidLeave').innerText = paidLeaveCount + "日";

            const ctx = document.getElementById('shiftDonutChart').getContext('2d');
            const chartData = [counts["早"], counts["遅"], counts["夜"], counts["明け"], counts["早テレ"], counts["遅テレ"], counts["夜テレ"], counts["休み"], counts["有休"], counts["未選択"]];

            if(donutChartInstance) { donutChartInstance.destroy(); }

            const isDark = document.documentElement.classList.contains('dark');

            donutChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['早番', '遅番', '夜勤', '明け', '早テレ', '遅テレ', '夜テレ', '休み', '有休', '未選択'],
                    datasets: [{
                        data: chartData,
                        backgroundColor: ['#f59e0b', '#f97316', '#4f46e5', '#10b981', '#06b6d4', '#0ea5e9', '#6366f1', '#cbd5e1', '#ec4899', '#94a3b8'],
                        borderWidth: 2,
                        borderColor: isDark ? '#0f172a' : '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: { 
                                boxWidth: 10, 
                                font: { size: 10, family: 'Plus Jakarta Sans' },
                                color: isDark ? '#cbd5e1' : '#475569'
                            }
                        }
                    },
                    cutout: '65%'
                }
            });
        }

        function registerSingle(dateStr, shiftType) {
            const registeredIds = getRegisteredIds();
            if (registeredIds.includes(dateStr)) {
                alert("【二重登録ガード】この日のシフトはすでにカレンダー登録済みです！");
                return;
            }

            const cleanDate = dateStr.replace(/-/g, '');
            const title = encodeURIComponent(`[シフト] ${shiftType}`);
            const details = encodeURIComponent(`Shift Sync Dashboardからの自動登録 (${shiftType})`);
            
            const gcalUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${cleanDate}/${cleanDate}&details=${details}`;
            window.open(gcalUrl, '_blank');

            registeredIds.push(dateStr);
            saveRegisteredIds(registeredIds);
            renderTable();
        }

        function bulkRegisterGCal() {
            const confirmed = confirm(`【実行前の確認】\n\n【${currentYear}年${currentMonth}月】の未登録シフトをGoogleカレンダーに一括登録します。\n本当によろしいですか？`);
            if (!confirmed) return;

            const shifts = getCurrentShifts();
            const registeredIds = getRegisteredIds();
            let newRegisterCount = 0;

            shifts.forEach(item => {
                if (item.type === '未選択') return;

                const dateStr = `${currentYear}-${String(currentMonth).padStart(2, '0')}-${String(item.day).padStart(2, '0')}`;
                
                if (!registeredIds.includes(dateStr)) {
                    const cleanDate = dateStr.replace(/-/g, '');
                    const title = encodeURIComponent(`[シフト] ${item.type}`);
                    const details = encodeURIComponent(`Shift Sync Dashboard 一括登録 (${item.type})`);
                    const gcalUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${cleanDate}/${cleanDate}&details=${details}`;
                    
                    window.open(gcalUrl, '_blank');
                    registeredIds.push(dateStr);
                    newRegisterCount++;
                }
            });

            saveRegisteredIds(registeredIds);
            renderTable();

            if (newRegisterCount > 0) {
                alert(`${currentYear}年${currentMonth}月の新着シフト ${newRegisterCount}件をGoogleカレンダーに登録しました！`);
            } else {
                alert("【二重登録ガード】新しく登録する対象のシフトはありません。");
            }
        }

        function resetRegisteredStatus() {
            const confirmed = confirm(`【実行前の確認】\n\n【${currentYear}年${currentMonth}月】のGoogleカレンダー登録履歴（二重登録ガードの記録）をリセットします。\n\n※この操作を行うと、この月の全シフトが未登録の状態になります。実行しますか？`);
            if (!confirmed) return;

            localStorage.removeItem(getRegisteredKey());
            renderTable();
            alert(`${currentYear}年${currentMonth}月の登録履歴をリセットしました。`);
        }

        function toggleDarkMode() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.className = "fa-solid fa-moon";
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                icon.className = "fa-solid fa-sun";
                localStorage.setItem('theme', 'dark');
            }
            updateSummaryAndChart();
        }

        function shareToLine() {
            const shareUrl = window.location.href;
            const shareText = 
                `📅【${currentYear}年${currentMonth}月 チームシフトダッシュボード】\n` +
                `今月のシフト表とワークサマリーが更新されました。\n` +
                `確認やGoogleカレンダーへの登録はこちらから行えます！\n\n` +
                `🔗 ` + shareUrl;

            window.open(`https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent(shareText)}`, '_blank');
        }

        window.onload = function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('themeIcon').className = "fa-solid fa-sun";
            }
            
            document.getElementById('selectYear').value = currentYear;
            document.getElementById('selectMonth').value = currentMonth;
            document.getElementById('summaryTitleLabel').innerText = `${currentYear}年${currentMonth}月`;
            
            renderTable();
        };
    </script>
</body>
</html>
