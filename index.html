<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shift Sync Dashboard Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+JP:wght@500;700;900&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.14) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(168, 85, 247, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.10) 0px, transparent 50%),
                radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 24px 24px;
            background-attachment: fixed;
        }
        .dark body {
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.22) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.18) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.12) 0px, transparent 50%),
                radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 24px 24px;
            background-attachment: fixed;
        }
        .glass-card { 
            background: rgba(255, 255, 255, 0.92); 
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08), 0 0 1px 1px rgba(15, 23, 42, 0.05);
        }
        .dark .glass-card { 
            background: rgba(15, 23, 42, 0.85); 
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5), 0 0 1px 1px rgba(255, 255, 255, 0.08);
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.4); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.6); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen antialiased p-4 sm:p-6 lg:p-8 transition-colors duration-300">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header Section -->
        <header class="glass-card rounded-3xl p-5 sm:p-6 flex flex-col xl:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-600 via-violet-600 to-purple-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30 shrink-0">
                    <i class="fa-solid fa-layer-group text-xl"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase tracking-widest bg-indigo-100 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800">
                            Team Cloud Sync Suite
                        </span>
                    </div>
                    <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-slate-900 dark:text-white mt-0.5">
                        Shift Sync <span class="bg-gradient-to-r from-indigo-600 to-violet-600 dark:from-indigo-400 dark:to-violet-400 bg-clip-text text-transparent">Dashboard</span>
                    </h1>
                </div>
            </div>

            <!-- Controls & Actions -->
            <div class="flex flex-wrap items-center justify-center gap-2.5">
                <div class="flex items-center bg-slate-100/90 dark:bg-slate-900/90 rounded-2xl p-1 border border-slate-200/80 dark:border-slate-700/80 shadow-inner gap-0.5">
                    <button onclick="changeMonthRelative(-1)" class="w-9 h-9 flex items-center justify-center hover:bg-white dark:hover:bg-slate-800 rounded-xl transition-all text-slate-700 dark:text-slate-200 hover:shadow-sm" title="前月へ">
                        <i class="fa-solid fa-chevron-left text-xs"></i>
                    </button>
                    <select id="selectYear" onchange="changeMonthYear()" class="bg-transparent font-extrabold text-sm text-slate-800 dark:text-slate-100 px-2 py-1.5 outline-none cursor-pointer">
                        <option value="2026">2026年</option>
                        <option value="2027">2027年</option>
                        <option value="2028">2028年</option>
                        <option value="2029">2029年</option>
                        <option value="2030">2030年</option>
                    </select>
                    <select id="selectMonth" onchange="changeMonthYear()" class="bg-transparent text-indigo-600 dark:text-indigo-400 font-extrabold text-sm px-2 py-1.5 outline-none cursor-pointer">
                        <option value="1">1月</option>
                        <option value="2">2月</option>
                        <option value="3">3月</option>
                        <option value="4">4月</option>
                        <option value="5">5月</option>
                        <option value="6">6月</option>
                        <option value="7">7月</option>
                        <option value="8">8月</option>
                        <option value="9">9月</option>
                        <option value="10">10月</option>
                        <option value="11">11月</option>
                        <option value="12">12月</option>
                    </select>
                    <button onclick="changeMonthRelative(1)" class="w-9 h-9 flex items-center justify-center hover:bg-white dark:hover:bg-slate-800 rounded-xl transition-all text-slate-700 dark:text-slate-200 hover:shadow-sm" title="次月へ">
                        <i class="fa-solid fa-chevron-right text-xs"></i>
                    </button>
                </div>

                <button onclick="jumpToCurrentMonth()" class="bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-100 border border-slate-200/90 dark:border-slate-700 text-xs font-bold px-3.5 py-2.5 rounded-2xl transition-all shadow-sm hover:-translate-y-0.5 flex items-center gap-1.5" title="当月にジャンプ">
                    <i class="fa-solid fa-calendar-day text-indigo-600 dark:text-indigo-400"></i> 当月へ戻る
                </button>

                <button onclick="toggleDarkMode()" class="w-10 h-10 flex items-center justify-center rounded-2xl bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 border border-slate-200/90 dark:border-slate-700 transition-all text-slate-700 dark:text-slate-200 shadow-sm hover:-translate-y-0.5" title="モード切替">
                    <i id="themeIcon" class="fa-solid fa-moon"></i>
                </button>

                <button onclick="shareToLine()" class="bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-bold px-4 py-2.5 rounded-2xl text-xs sm:text-sm shadow-lg shadow-emerald-500/25 transition-all hover:-translate-y-0.5 flex items-center gap-2">
                    <i class="fa-brands fa-line text-lg"></i> LINE共有
                </button>
                <button onclick="openCsvModal()" class="bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-bold px-4 py-2.5 rounded-2xl text-xs sm:text-sm shadow-lg shadow-indigo-600/25 transition-all hover:-translate-y-0.5 flex items-center gap-2">
                    <i class="fa-solid fa-file-arrow-down"></i> シフト一括登録 (CSV)
                </button>
            </div>
        </header>

        <!-- Main Layout Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Left Side: Professional Monthly Work Summary & Donut Chart (5 Cols) -->
            <div class="lg:col-span-5 space-y-6">
                <div class="glass-card rounded-3xl p-6 space-y-6">
                    <div class="flex items-center justify-between border-b border-slate-200/80 dark:border-slate-800 pb-4">
                        <h2 class="text-lg sm:text-xl font-black text-slate-900 dark:text-white flex items-center gap-2.5 tracking-tight">
                            <span class="w-8 h-8 rounded-xl bg-indigo-100 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 flex items-center justify-center">
                                <i class="fa-solid fa-chart-pie text-sm"></i>
                            </span>
                            <span><span id="summaryTitleLabel" class="text-indigo-600 dark:text-indigo-400">2026年11月</span> 月次ワークサマリー</span>
                        </h2>
                        <!-- Cloud Sync Status Indicator -->
                        <span id="syncStatusBadge" class="text-[11px] font-bold px-2.5 py-1 rounded-xl bg-slate-100 dark:bg-slate-900 text-slate-500 flex items-center gap-1.5 border border-slate-200 dark:border-slate-800">
                            <i class="fa-solid fa-cloud text-slate-400"></i> 同期待機中
                        </span>
                    </div>

                    <!-- Metric Cards Grid -->
                    <div class="grid grid-cols-2 gap-3.5">
                        <div class="bg-white dark:bg-slate-900/90 border border-slate-200/90 dark:border-slate-800 rounded-2xl p-4 shadow-sm relative overflow-hidden group hover:border-indigo-300 dark:hover:border-indigo-700 transition-all">
                            <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-indigo-500"></div>
                            <div class="flex items-center justify-between">
                                <span class="text-xs sm:text-sm font-bold text-slate-700 dark:text-slate-200">総出勤日数</span>
                                <span class="w-7 h-7 rounded-lg bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-xs">
                                    <i class="fa-solid fa-briefcase"></i>
                                </span>
                            </div>
                            <div id="statWorkDays" class="text-2xl sm:text-3xl font-black text-indigo-600 dark:text-indigo-400 mt-1.5 tracking-tight">0日</div>
                        </div>

                        <div class="bg-white dark:bg-slate-900/90 border border-slate-200/90 dark:border-slate-800 rounded-2xl p-4 shadow-sm relative overflow-hidden group hover:border-slate-400 dark:hover:border-slate-600 transition-all">
                            <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-slate-700 dark:bg-slate-400"></div>
                            <div class="flex items-center justify-between">
                                <span class="text-xs sm:text-sm font-bold text-slate-700 dark:text-slate-200">概算総労働時間</span>
                                <span class="w-7 h-7 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 flex items-center justify-center text-xs">
                                    <i class="fa-regular fa-clock"></i>
                                </span>
                            </div>
                            <div id="statWorkHours" class="text-2xl sm:text-3xl font-black text-slate-900 dark:text-white mt-1.5 tracking-tight">0h</div>
                        </div>

                        <div class="bg-white dark:bg-slate-900/90 border border-slate-200/90 dark:border-slate-800 rounded-2xl p-4 shadow-sm relative overflow-hidden group hover:border-amber-300 dark:hover:border-amber-700 transition-all">
                            <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-amber-500"></div>
                            <div class="flex items-center justify-between">
                                <span class="text-xs sm:text-sm font-bold text-slate-700 dark:text-slate-200">早番回数</span>
                                <span class="w-7 h-7 rounded-lg bg-amber-50 dark:bg-amber-950/60 text-amber-600 dark:text-amber-400 flex items-center justify-center text-xs">
                                    <i class="fa-solid fa-sun"></i>
                                </span>
                            </div>
                            <div id="statEarlyCount" class="text-2xl sm:text-3xl font-black text-amber-600 dark:text-amber-400 mt-1.5 tracking-tight">0回</div>
                        </div>

                        <div class="bg-white dark:bg-slate-900/90 border border-slate-200/90 dark:border-slate-800 rounded-2xl p-4 shadow-sm relative overflow-hidden group hover:border-orange-300 dark:hover:border-orange-700 transition-all">
                            <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-orange-500"></div>
                            <div class="flex items-center justify-between">
                                <span class="text-xs sm:text-sm font-bold text-slate-700 dark:text-slate-200">遅番回数</span>
                                <span class="w-7 h-7 rounded-lg bg-orange-50 dark:bg-orange-950/60 text-orange-600 dark:text-orange-400 flex items-center justify-center text-xs">
                                    <i class="fa-solid fa-cloud-sun"></i>
                                </span>
                            </div>
                            <div id="statLateCount" class="text-2xl sm:text-3xl font-black text-orange-600 dark:text-orange-400 mt-1.5 tracking-tight">0回</div>
                        </div>

                        <div class="bg-white dark:bg-slate-900/90 border border-slate-200/90 dark:border-slate-800 rounded-2xl p-4 shadow-sm relative overflow-hidden group hover:border-violet-300 dark:hover:border-violet-700 transition-all">
                            <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-violet-600"></div>
                            <div class="flex items-center justify-between">
                                <span class="text-xs sm:text-sm font-bold text-slate-700 dark:text-slate-200">夜勤回数</span>
                                <span class="w-7 h-7 rounded-lg bg-violet-50 dark:bg-violet-950/60 text-violet-600 dark:text-violet-400 flex items-center justify-center text-xs">
                                    <i class="fa-solid fa-moon"></i>
                                </span>
                            </div>
                            <div id="statNightCount" class="text-2xl sm:text-3xl font-black text-violet-600 dark:text-violet-400 mt-1.5 tracking-tight">0回</div>
                        </div>

                        <div class="bg-white dark:bg-slate-900/90 border border-slate-200/90 dark:border-slate-800 rounded-2xl p-4 shadow-sm relative overflow-hidden group hover:border-cyan-300 dark:hover:border-cyan-700 transition-all">
                            <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-cyan-500"></div>
                            <div class="flex items-center justify-between">
                                <span class="text-xs sm:text-sm font-bold text-slate-700 dark:text-slate-200">テレワーク日数</span>
                                <span class="w-7 h-7 rounded-lg bg-cyan-50 dark:bg-cyan-950/60 text-cyan-600 dark:text-cyan-400 flex items-center justify-center text-xs">
                                    <i class="fa-solid fa-laptop-house"></i>
                                </span>
                            </div>
                            <div id="statTeleworkCount" class="text-2xl sm:text-3xl font-black text-cyan-600 dark:text-cyan-400 mt-1.5 tracking-tight">0日</div>
                        </div>

                        <div class="bg-white dark:bg-slate-900/90 border border-slate-200/90 dark:border-slate-800 rounded-2xl p-4 shadow-sm relative overflow-hidden group hover:border-pink-300 dark:hover:border-pink-700 transition-all">
                            <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-pink-500"></div>
                            <div class="flex items-center justify-between">
                                <span class="text-xs sm:text-sm font-bold text-slate-700 dark:text-slate-200">有休取得</span>
                                <span class="w-7 h-7 rounded-lg bg-pink-50 dark:bg-pink-950/60 text-pink-600 dark:text-pink-400 flex items-center justify-center text-xs">
                                    <i class="fa-solid fa-umbrella-beach"></i>
                                </span>
                            </div>
                            <div id="statPaidLeave" class="text-2xl sm:text-3xl font-black text-pink-600 dark:text-pink-400 mt-1.5 tracking-tight">0日</div>
                        </div>

                        <div class="bg-white dark:bg-slate-900/90 border border-slate-200/90 dark:border-slate-800 rounded-2xl p-4 shadow-sm relative overflow-hidden group hover:border-emerald-300 dark:hover:border-emerald-700 transition-all">
                            <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-emerald-500"></div>
                            <div class="flex items-center justify-between">
                                <span class="text-xs sm:text-sm font-bold text-slate-700 dark:text-slate-200">公休・休み</span>
                                <span class="w-7 h-7 rounded-lg bg-emerald-50 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-xs">
                                    <i class="fa-solid fa-mug-hot"></i>
                                </span>
                            </div>
                            <div id="statOffCount" class="text-2xl sm:text-3xl font-black text-emerald-600 dark:text-emerald-400 mt-1.5 tracking-tight">0日</div>
                        </div>
                    </div>

                    <!-- Donut Chart Card -->
                    <div class="bg-white dark:bg-slate-900/90 border border-slate-200/90 dark:border-slate-800 rounded-2xl p-5 shadow-sm relative">
                        <div class="text-xs font-extrabold text-slate-700 dark:text-slate-200 uppercase tracking-wider mb-3 flex items-center gap-1.5">
                            <i class="fa-solid fa-chart-simple text-indigo-500"></i> シフト構成比バランス
                        </div>
                        <div class="w-full h-[210px] flex justify-center relative">
                            <canvas id="shiftDonutChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Side: Shift Table (7 Cols) -->
            <div class="lg:col-span-7 space-y-6">
                <div class="glass-card rounded-3xl p-6">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-200/80 dark:border-slate-800 pb-4 mb-4">
                        <h2 class="text-lg sm:text-xl font-black text-slate-900 dark:text-white flex items-center gap-2.5 tracking-tight">
                            <span class="w-8 h-8 rounded-xl bg-indigo-100 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 flex items-center justify-center">
                                <i class="fa-solid fa-calendar-days text-sm"></i>
                            </span>
                            <span><span id="tableTitleLabel" class="text-indigo-600 dark:text-indigo-400">2026年11月</span> シフト一覧</span>
                        </h2>
                        <div class="relative">
                            <select id="filterType" onchange="renderTable()" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs font-bold text-slate-700 dark:text-slate-200 rounded-xl px-3.5 py-2 outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer shadow-sm">
                                <option value="all">すべてのシフトを表示</option>
                                <option value="未選択">未選択のみ</option>
                                <option value="早（8:00～17:00）">早番のみ</option>
                                <option value="遅（13:00～22:00）">遅番のみ</option>
                                <option value="夜（21:30～8:30）">夜勤のみ</option>
                                <option value="明け">明けのみ</option>
                                <option value="早（テレワーク）">早(テレワーク)</option>
                                <option value="遅（テレワーク）">遅(テレワーク)</option>
                                <option value="夜（テレワーク）">夜(テレワーク)</option>
                                <option value="休み">休みのみ</option>
                                <option value="有休">有休のみ</option>
                            </select>
                        </div>
                    </div>

                    <div class="overflow-x-auto max-h-[560px] rounded-2xl border border-slate-200/90 dark:border-slate-800 shadow-inner bg-white/60 dark:bg-slate-900/40">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead class="bg-slate-100/95 dark:bg-slate-900/95 sticky top-0 text-slate-700 dark:text-slate-200 text-xs uppercase font-extrabold z-10 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
                                <tr>
                                    <th class="p-3.5">日付</th>
                                    <th class="p-3.5">曜日</th>
                                    <th class="p-3.5">シフト種別 (変更可)</th>
                                </tr>
                            </thead>
                            <tbody id="shiftTableBody" class="divide-y divide-slate-100 dark:divide-slate-800/70 text-slate-800 dark:text-slate-100 text-xs sm:text-sm">
                                <!-- Dynamic Render -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <!-- CSV Export Range Modal -->
    <div id="csvModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-card rounded-3xl p-6 sm:p-8 max-w-md w-full space-y-6 shadow-2xl border border-slate-200 dark:border-slate-800">
            <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-4">
                <h3 class="text-lg font-black text-slate-900 dark:text-white flex items-center gap-2">
                    <i class="fa-solid fa-file-arrow-down text-indigo-600 dark:text-indigo-400"></i> CSVエクスポート範囲の指定
                </h3>
                <button onclick="closeCsvModal()" class="w-8 h-8 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="space-y-4">
                <p class="text-xs text-slate-600 dark:text-slate-300">
                    <span id="modalMonthTitle" class="font-bold text-indigo-600 dark:text-indigo-400">2026年11月</span> の中で、カレンダーに登録したい日付の範囲を選んでください。
                </p>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">開始日</label>
                        <select id="csvStartDay" class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs font-bold rounded-xl px-3 py-2.5 outline-none focus:ring-2 focus:ring-indigo-500">
                            <!-- Dynamic Options -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">終了日</label>
                        <select id="csvEndDay" class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs font-bold rounded-xl px-3 py-2.5 outline-none focus:ring-2 focus:ring-indigo-500">
                            <!-- Dynamic Options -->
                        </select>
                    </div>
                </div>

                <div class="pt-2">
                    <label class="flex items-center gap-2.5 cursor-pointer select-none bg-slate-100/80 dark:bg-slate-900/80 p-3 rounded-2xl border border-slate-200 dark:border-slate-800">
                        <input type="checkbox" id="csvExcludeOff" checked class="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500 cursor-pointer">
                        <span class="text-xs font-bold text-slate-700 dark:text-slate-300">「休み」「有休」の日はCSVに含めない（省く）</span>
                    </label>
                </div>
            </div>

            <div class="flex items-center justify-end gap-3 pt-2">
                <button onclick="closeCsvModal()" class="px-4 py-2.5 rounded-xl bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 text-xs font-bold hover:bg-slate-300 dark:hover:bg-slate-700 transition-colors">
                    キャンセル
                </button>
                <button onclick="executeCsvExport()" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-lg shadow-indigo-600/25 transition-all flex items-center gap-2">
                    <i class="fa-solid fa-download"></i> CSVをダウンロード
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxz5M4uHAE4suh6X8v-N9S_5phSkv1wHc2cvYlG6gvgV6lbDHLyD6gTfJSsT7CTabfn/exec";

        const shiftTypesList = [
            "未選択",
            "早（8:00～17:00）",
            "遅（13:00～22:00）",
            "夜（21:30～8:30）",
            "明け",
            "早（テレワーク）",
            "遅（テレワーク）",
            "夜（テレワーク）",
            "休み",
            "有休"
        ];

        const HOLIDAY_MASTER = {
            "2026-1-1": "元日", "2026-1-12": "成人の日", "2026-2-11": "建国記念の日", "2026-2-23": "天皇誕生日",
            "2026-3-20": "春分の日", "2026-4-29": "昭和の日", "2026-5-3": "憲法記念日", "2026-5-4": "みどりの日",
            "2026-5-5": "こどもの日", "2026-5-6": "振替休日", "2026-7-20": "海の日", "2026-8-11": "山の日",
            "2026-9-21": "敬老の日", "2026-9-22": "国民の休日", "2026-9-23": "秋分の日", "2026-10-12": "スポーツの日",
            "2026-11-3": "文化の日", "2026-11-23": "勤労感謝の日",

            "2027-1-1": "元日", "2027-1-11": "成人の日", "2027-2-11": "建国記念の日", "2027-2-23": "天皇誕生日",
            "2027-3-21": "春分の日", "2027-3-22": "振替休日", "2027-4-29": "昭和の日", "2027-5-3": "憲法記念日",
            "2027-5-4": "みどりの日", "2027-5-5": "こどもの日", "2027-7-19": "海の日", "2027-8-11": "山の日",
            "2027-9-20": "敬老の日", "2027-9-23": "秋分の日", "2027-10-11": "スポーツの日",
            "2027-11-3": "文化の日", "2027-11-23": "勤労感謝の日",

            "2028-1-1": "元日", "2028-1-10": "成人の日", "2028-2-11": "建国記念の日", "2028-2-23": "天皇誕生日",
            "2028-3-20": "春分の日", "2028-4-29": "昭和の日", "2028-5-3": "憲法記念日", "2028-5-4": "みどりの日",
            "2028-5-5": "こどもの日", "2028-7-17": "海の日", "2028-8-11": "山の日", "2028-9-18": "敬老の日",
            "2028-9-22": "秋分の日", "2028-10-9": "スポーツの日", "2028-11-3": "文化の日", "2028-11-23": "勤労感謝の日",

            "2029-1-1": "元日", "2029-1-8": "成人の日", "2029-2-11": "建国記念の日", "2029-2-12": "振替休日",
            "2029-2-23": "天皇誕生日", "2029-3-20": "春分の日", "2029-4-29": "昭和の日", "2029-4-30": "振替休日",
            "2029-5-3": "憲法記念日", "2029-5-4": "みどりの日", "2029-5-5": "こどもの日", "2029-7-16": "海の日",
            "2029-8-11": "山の日", "2029-9-17": "敬老の日", "2029-9-23": "秋分の日", "2029-9-24": "振替休日",
            "2029-10-8": "スポーツの日", "2029-11-3": "文化の日", "2029-11-23": "勤労感謝の日",

            "2030-1-1": "元日", "2030-1-14": "成人の日", "2030-2-11": "建国記念の日", "2030-2-23": "天皇誕生日",
            "2030-3-20": "春分の日", "2030-4-29": "昭和の日", "2030-5-3": "憲法記念日", "2030-5-4": "みどりの日",
            "2030-5-5": "こどもの日", "2030-5-6": "振替休日", "2030-7-15": "海の日", "2030-8-11": "山の日", "2030-8-12": "振替休日", "2030-9-16": "敬老の日", "2030-9-23": "秋分の日", "2030-10-14": "スポーツの日",
            "2030-11-3": "文化の日", "2030-11-4": "振替休日", "2030-11-23": "勤労感謝の日"
        };

        function getJapaneseHoliday(year, month, day) {
            return HOLIDAY_MASTER[`${year}-${month}-${day}`] || null;
        }

        function generateDefaultMonthData(year, month) {
            const daysInMonth = new Date(year, month, 0).getDate();
            const weekDays = ["日", "月", "火", "水", "木", "金", "土"];
            
            let data = [];
            for (let d = 1; d <= daysInMonth; d++) {
                const dateObj = new Date(year, month - 1, d);
                const w = weekDays[dateObj.getDay()];
                const holidayName = getJapaneseHoliday(year, month, d);
                data.push({ day: d, week: w, holiday: holidayName, type: "未選択" });
            }
            return data;
        }

        const now = new Date();
        let currentYear = now.getFullYear();
        let currentMonth = now.getMonth() + 1;
        let donutChartInstance = null;
        
        let shiftCache = {}; 
        let isCloudLoaded = false;

        function getYearMonthKey(y, m) {
            return `${y}-${String(m).padStart(2, '0')}`;
        }

        async function fetchShiftsFromCloud() {
            setSyncStatus("loading", "クラウド読込中...");
            try {
                const res = await fetch(GAS_API_URL);
                const data = await res.json();
                
                shiftCache = {};
                data.forEach(item => {
                    if (!shiftCache[item.yearMonth]) {
                        shiftCache[item.yearMonth] = {};
                    }
                    shiftCache[item.yearMonth][item.day] = item.type;
                });

                isCloudLoaded = true;
                setSyncStatus("synced", "クラウド同期完了");
            } catch (err) {
                console.error("Cloud fetch error:", err);
                setSyncStatus("error", "同期エラー (オフライン)");
            }
            renderTable();
        }

        async function saveShiftsToCloud(targetY, targetM, shiftsArray) {
            setSyncStatus("loading", "保存中...");
            const ymKey = getYearMonthKey(targetY, targetM);

            const payload = {
                yearMonth: ymKey,
                shifts: shiftsArray.map(s => ({ day: s.day, type: s.type }))
            };

            try {
                await fetch(GAS_API_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify(payload)
                });

                setSyncStatus("synced", "クラウド同期完了");
            } catch (err) {
                console.error("Cloud save error:", err);
                setSyncStatus("error", "保存失敗");
            }
        }

        function setSyncStatus(status, text) {
            const badge = document.getElementById('syncStatusBadge');
            if (status === "loading") {
                badge.className = "text-[11px] font-bold px-2.5 py-1 rounded-xl bg-amber-50 dark:bg-amber-950/60 text-amber-600 dark:text-amber-400 flex items-center gap-1.5 border border-amber-200 dark:border-amber-800 animate-pulse";
                badge.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> ${text}`;
            } else if (status === "synced") {
                badge.className = "text-[11px] font-bold px-2.5 py-1 rounded-xl bg-emerald-50 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 flex items-center gap-1.5 border border-emerald-200 dark:border-emerald-800";
                badge.innerHTML = `<i class="fa-solid fa-cloud-check text-emerald-500"></i> ${text}`;
            } else {
                badge.className = "text-[11px] font-bold px-2.5 py-1 rounded-xl bg-rose-50 dark:bg-rose-950/60 text-rose-600 dark:text-rose-400 flex items-center gap-1.5 border border-rose-200 dark:border-rose-800";
                badge.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> ${text}`;
            }
        }

        function getCurrentShifts() {
            const ymKey = getYearMonthKey(currentYear, currentMonth);
            const defaultData = generateDefaultMonthData(currentYear, currentMonth);

            if (!shiftCache[ymKey]) {
                return defaultData;
            }

            return defaultData.map(item => {
                if (shiftCache[ymKey][item.day]) {
                    item.type = shiftCache[ymKey][item.day];
                }
                return item;
            });
        }

        function updateLabels() {
            const labelText = `${currentYear}年${currentMonth}月`;
            document.getElementById('summaryTitleLabel').innerText = labelText;
            document.getElementById('tableTitleLabel').innerText = labelText;
        }

        function changeMonthYear() {
            currentYear = parseInt(document.getElementById('selectYear').value);
            currentMonth = parseInt(document.getElementById('selectMonth').value);
            updateLabels();
            renderTable();
            updateSummaryAndChart();
        }

        function changeMonthRelative(direction) {
            currentMonth += direction;
            if (currentMonth > 12) {
                currentMonth = 1;
                currentYear++;
            } else if (currentMonth < 1) {
                currentMonth = 12;
                currentYear--;
            }

            if (currentYear > 2030) { currentYear = 2030; currentMonth = 12; }
            if (currentYear < 2026) { currentYear = 2026; currentMonth = 1; }

            document.getElementById('selectYear').value = currentYear;
            document.getElementById('selectMonth').value = currentMonth;
            updateLabels();
            renderTable();
            updateSummaryAndChart();
        }

        function jumpToCurrentMonth() {
            const realNow = new Date();
            currentYear = realNow.getFullYear();
            currentMonth = realNow.getMonth() + 1;
            
            document.getElementById('selectYear').value = currentYear;
            document.getElementById('selectMonth').value = currentMonth;
            updateLabels();
            renderTable();
            updateSummaryAndChart();
        }

        function updateShiftType(day, newType) {
            const ymKey = getYearMonthKey(currentYear, currentMonth);
            if (!shiftCache[ymKey]) {
                shiftCache[ymKey] = {};
            }
            shiftCache[ymKey][day] = newType;

            renderTable();
            updateSummaryAndChart();

            const currentShifts = getCurrentShifts();
            saveShiftsToCloud(currentYear, currentMonth, currentShifts);
        }

        function renderTable() {
            const tbody = document.getElementById('shiftTableBody');
            const filter = document.getElementById('filterType').value;
            const shifts = getCurrentShifts();
            
            tbody.innerHTML = '';
            
            shifts.forEach(item => {
                if (filter !== 'all' && !item.type.includes(filter)) return;

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50/90 dark:hover:bg-slate-800/60 transition-colors";
                
                let rowBgClass = "";
                let weekColorClass = "text-slate-600 dark:text-slate-300";
                
                if (item.holiday) {
                    rowBgClass = "bg-rose-100/90 dark:bg-rose-950/50 font-semibold";
                    weekColorClass = "text-rose-700 dark:text-rose-400 font-black";
                } else if (item.week === "日") {
                    rowBgClass = "bg-rose-50/80 dark:bg-rose-950/25";
                    weekColorClass = "text-rose-600 dark:text-rose-400 font-black";
                } else if (item.week === "土") {
                    rowBgClass = "bg-sky-100/80 dark:bg-sky-950/30";
                    weekColorClass = "text-sky-700 dark:text-sky-400 font-black";
                }

                if (rowBgClass) {
                    tr.className += ` ${rowBgClass}`;
                }

                let weekDisplay = `(${item.week})`;
                if (item.holiday) {
                    weekDisplay = `<span class="inline-flex items-center gap-1.5"><span class="${weekColorClass}">( ${item.week} )</span> <span class="text-[11px] bg-rose-600 text-white dark:bg-rose-700 dark:text-rose-100 px-2 py-0.5 rounded-md font-bold shadow-sm">${item.holiday}</span></span>`;
                }

                let optionsHtml = '';
                shiftTypesList.forEach(st => {
                    const selected = item.type === st ? 'selected' : '';
                    optionsHtml += `<option value="${st}" ${selected}>${st}</option>`;
                });

                let badgeClass = "bg-white text-slate-700 dark:bg-slate-800 dark:text-slate-200";
                if(item.type.includes('早（8:00')) badgeClass = "bg-amber-100 text-amber-900 border-amber-300 dark:bg-amber-950/70 dark:text-amber-200 dark:border-amber-700";
                else if(item.type.includes('遅（13:00')) badgeClass = "bg-orange-100 text-orange-900 border-orange-300 dark:bg-orange-950/70 dark:text-orange-200 dark:border-orange-700";
                else if(item.type.includes('夜（21:30')) badgeClass = "bg-indigo-100 text-indigo-900 border-indigo-300 dark:bg-indigo-950/70 dark:text-indigo-200 dark:border-indigo-700";
                else if(item.type.includes('明け')) badgeClass = "bg-emerald-100 text-emerald-900 border-emerald-300 dark:bg-emerald-950/70 dark:text-emerald-200 dark:border-emerald-700";
                else if(item.type.includes('テレワーク')) badgeClass = "bg-cyan-100 text-cyan-900 border-cyan-300 dark:bg-cyan-950/70 dark:text-cyan-200 dark:border-cyan-700";
                else if(item.type.includes('有休')) badgeClass = "bg-pink-100 text-pink-900 border-pink-300 dark:bg-pink-950/70 dark:text-pink-200 dark:border-pink-700";
                else if(item.type.includes('休み')) badgeClass = "bg-slate-200 text-slate-800 border-slate-300 dark:bg-slate-700 dark:text-slate-200 dark:border-slate-600";

                tr.innerHTML = `
                    <td class="p-3.5 font-extrabold text-slate-800 dark:text-slate-100">${currentMonth}月 ${item.day}日</td>
                    <td class="p-3.5 ${weekColorClass}">${weekDisplay}</td>
                    <td class="p-3.5">
                        <select onchange="updateShiftType(${item.day}, this.value)" class="text-xs font-bold px-3 py-1.5 rounded-xl border border-slate-300 dark:border-slate-700 outline-none focus:ring-2 focus:ring-indigo-500 ${badgeClass} cursor-pointer shadow-sm transition-all">
                            ${optionsHtml}
                        </select>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            updateSummaryAndChart();
        }

        function updateSummaryAndChart() {
            const shifts = getCurrentShifts();
            
            let workDays = 0;
            let workHours = 0;
            let earlyCount = 0;
            let lateCount = 0;
            let nightCount = 0;
            let teleworkCount = 0;
            let paidLeaveCount = 0;
            let offCount = 0;

            let counts = { "早": 0, "遅": 0, "夜": 0, "明け": 0, "早テレ": 0, "遅テレ": 0, "夜テレ": 0, "休み": 0, "有休": 0, "未選択": 0 };

            shifts.forEach(s => {
                if(s.type.includes('早（8:00')) { workDays++; workHours += 8; earlyCount++; counts["早"]++; }
                else if(s.type.includes('遅（13:00')) { workDays++; workHours += 8; lateCount++; counts["遅"]++; }
                else if(s.type.includes('夜（21:30')) { workDays++; workHours += 10; nightCount++; counts["夜"]++; }
                else if(s.type.includes('早（テレワーク）')) { workDays++; workHours += 8; earlyCount++; teleworkCount++; counts["早テレ"]++; }
                else if(s.type.includes('遅（テレワーク）')) { workDays++; workHours += 8; lateCount++; teleworkCount++; counts["遅テレ"]++; }
                else if(s.type.includes('夜（テレワーク）')) { workDays++; workHours += 10; nightCount++; teleworkCount++; counts["夜テレ"]++; }
                else if(s.type.includes('明け')) { counts["明け"]++; }
                else if(s.type.includes('有休')) { paidLeaveCount++; counts["有休"]++; }
                else if(s.type.includes('休み')) { offCount++; counts["休み"]++; }
                else { counts["未選択"]++; }
            });

            document.getElementById('statWorkDays').innerText = workDays + "日";
            document.getElementById('statWorkHours').innerText = workHours + "h";
            document.getElementById('statEarlyCount').innerText = earlyCount + "回";
            document.getElementById('statLateCount').innerText = lateCount + "回";
            document.getElementById('statNightCount').innerText = nightCount + "回";
            document.getElementById('statTeleworkCount').innerText = teleworkCount + "日";
            document.getElementById('statPaidLeave').innerText = paidLeaveCount + "日";
            document.getElementById('statOffCount').innerText = offCount + "日";

            const ctx = document.getElementById('shiftDonutChart').getContext('2d');
            const chartData = [counts["早"], counts["遅"], counts["夜"], counts["明け"], counts["早テレ"], counts["遅テレ"], counts["夜テレ"], counts["休み"], counts["有休"], counts["未選択"]];

            if(donutChartInstance) { donutChartInstance.destroy(); }

            const isDark = document.documentElement.classList.contains('dark');

            donutChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['早番', '遅番', '夜勤', '明け', '早テレ', '遅テレ', '夜テレ', '休み', '有休', '未選択'],
                    datasets: [{
                        data: chartData,
                        backgroundColor: ['#f59e0b', '#f97316', '#4f46e5', '#10b981', '#06b6d4', '#0ea5e9', '#6366f1', '#cbd5e1', '#ec4899', '#94a3b8'],
                        borderWidth: 2,
                        borderColor: isDark ? '#0f172a' : '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: { 
                                boxWidth: 11, 
                                padding: 10,
                                font: { size: 11, weight: 'bold', family: 'Plus Jakarta Sans' },
                                color: isDark ? '#e2e8f0' : '#334155'
                            }
                        }
                    },
                    cutout: '66%'
                }
            });
        }

        function openCsvModal() {
            document.getElementById('modalMonthTitle').innerText = `${currentYear}年${currentMonth}月`;
            const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();

            let startSelect = document.getElementById('csvStartDay');
            let endSelect = document.getElementById('csvEndDay');
            startSelect.innerHTML = '';
            endSelect.innerHTML = '';

            for (let i = 1; i <= daysInMonth; i++) {
                startSelect.innerHTML += `<option value="${i}">${i}日</option>`;
                endSelect.innerHTML += `<option value="${i}" ${i === daysInMonth ? 'selected' : ''}>${i}日</option>`;
            }

            document.getElementById('csvModal').classList.remove('hidden');
        }

        function closeCsvModal() {
            document.getElementById('csvModal').classList.add('hidden');
        }

        function executeCsvExport() {
            const startDay = parseInt(document.getElementById('csvStartDay').value);
            const endDay = parseInt(document.getElementById('csvEndDay').value);
            const excludeOff = document.getElementById('csvExcludeOff').checked;

            if (startDay > endDay) {
                alert("開始日は終了日より前の日付を選択してください。");
                return;
            }

            const shifts = getCurrentShifts();
            let targetShifts = shifts.filter(item => {
                if (item.day < startDay || item.day > endDay) return false;
                if (item.type === '未選択') return false;
                if (excludeOff && (item.type.includes('休み') || item.type.includes('有休'))) return false;
                return true;
            });

            if (targetShifts.length === 0) {
                alert("指定された期間内に条件に合うシフトが見つかりませんでした。");
                return;
            }

            let csvContent = "\uFEFFSubject,Start Date,All Day Event,Description\r\n";

            targetShifts.forEach(item => {
                const formattedDate = `${currentYear}/${String(currentMonth).padStart(2, '0')}/${String(item.day).padStart(2, '0')}`;
                const subject = `"[シフト] ${item.type}"`;
                const description = `"Shift Sync Dashboard 一括登録 (${item.type})"`;

                csvContent += `${subject},${formattedDate},True,${description}\r\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `shift_${currentYear}_${currentMonth}_${startDay}to${endDay}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            closeCsvModal();

            alert(`【完了】${currentYear}年${currentMonth}月（${startDay}日〜${endDay}日）のシフトCSVファイルのダウンロードが完了しました！\n\nGoogleカレンダーの設定 ＞ インポート/エクスポート から読み込ませてご利用ください。`);
        }

        function toggleDarkMode() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.className = "fa-solid fa-moon";
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                icon.className = "fa-solid fa-sun";
                localStorage.setItem('theme', 'dark');
            }
            updateSummaryAndChart();
        }

        function shareToLine() {
            const shareUrl = window.location.href;
            const shareText = 
                `📅【${currentYear}年${currentMonth}月 チームシフトダッシュボード】\n` +
                `今月のシフト表とワークサマリーが更新されました。\n` +
                `確認やGoogleカレンダーへの登録はこちらから行えます！\n\n` +
                `🔗 ` + shareUrl;

            window.open(`https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent(shareText)}`, '_blank');
        }

        window.onload = async function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('themeIcon').className = "fa-solid fa-sun";
            }
            
            document.getElementById('selectYear').value = currentYear;
            document.getElementById('selectMonth').value = currentMonth;
            updateLabels();

            // 起動時にスプレッドシートからデータを取得完了してからテーブルを描画
            await fetchShiftsFromCloud();
        };
    </script>
</body>
</html>
