<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shift Sync Dashboard Pro (Local Edition)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+JP:wght@500;700;900&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.14) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(168, 85, 247, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.10) 0px, transparent 50%),
                radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 24px 24px;
            background-attachment: fixed;
        }
        .dark body {
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.22) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.18) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.12) 0px, transparent 50%),
                radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 24px 24px;
            background-attachment: fixed;
        }
        .glass-card { 
            background: rgba(255, 255, 255, 0.92); 
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08), 0 0 1px 1px rgba(15, 23, 42, 0.05);
        }
        .dark .glass-card { 
            background: rgba(15, 23, 42, 0.85); 
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5), 0 0 1px 1px rgba(255, 255, 255, 0.08);
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.4); border-radius: 9999px; }

        @media print {
            body { background: white !important; color: black !important; }
            header, .no-print { display: none !important; }
            .glass-card { background: white !important; box-shadow: none !important; border: 1px solid #cbd5e1 !important; }
            .print-container { width: 100% !important; margin: 0 !important; padding: 0 !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen antialiased p-4 sm:p-6 lg:p-8 transition-colors duration-300">

        <!-- Header Section -->

                <div>

    <script>
        const shiftDetails = {
            "未選択": { label: "未選択", time: "-" },
            "早（出社）": { label: "早（出社）", time: "8:00～17:00" },
            "早（テレワーク）": { label: "早（テレワーク）", time: "8:00～17:00" },
            "遅（出社）": { label: "遅（出社）", time: "13:00～22:00" },
            "遅（テレワーク）": { label: "遅（テレワーク）", time: "13:00～22:00" },
            "夜（出社）": { label: "夜（出社）", time: "21:30～8:30" },
            "夜（テレワーク）": { label: "夜（テレワーク）", time: "21:30～8:30" },
            "明け": { label: "明け", time: "-" },
            "休み": { label: "休み", time: "-" },
            "有休": { label: "有休", time: "-" }
        };

        const shiftTypesList = Object.keys(shiftDetails);
        const HOLIDAY_MASTER = { "2026-11-3": "文化の日", "2026-11-23": "勤労感謝の日" };

        let now = new Date();
        let currentYear = now.getFullYear();
        let currentMonth = now.getMonth() + 1;
        let shiftStore = JSON.parse(localStorage.getItem('shift_store_local_v3') || '{}');
        let donutChartInstance = null;

        function getYearMonthKey(y, m) { return `${y}-${String(m).padStart(2, '0')}`; }

        function getMonthShifts(y, m) {
            const ymKey = getYearMonthKey(y, m);
            const daysInMonth = new Date(y, m, 0).getDate();
            const weekDays = ["日", "月", "火", "水", "木", "金", "土"];
            let data = [];
            for (let d = 1; d <= daysInMonth; d++) {
                const dateObj = new Date(y, m - 1, d);
                const rawType = (shiftStore[ymKey] && shiftStore[ymKey][d]) ? shiftStore[ymKey][d] : "未選択";
                const info = shiftDetails[rawType] || shiftDetails["未選択"];
                data.push({ 
                    year: y, month: m, day: d, 
                    week: weekDays[dateObj.getDay()], 
                    holiday: HOLIDAY_MASTER[`${y}-${m}-${d}`] || null, 
                    rawType: rawType,
                    label: info.label,
                    time: info.time
                });
            }
            return data;
        }

        function updateLabels() {
            const labelText = `${currentYear}年${currentMonth}月`;
            document.getElementById('summaryTitleLabel').innerText = labelText;
            document.getElementById('tableTitleLabel').innerText = labelText;
        }

        function changeMonthYear() {
            currentYear = parseInt(document.getElementById('selectYear').value);
            currentMonth = parseInt(document.getElementById('selectMonth').value);
            updateLabels();
            renderTable();
        }

        function changeMonthRelative(dir) {
            currentMonth += dir;
            if (currentMonth > 12) { currentMonth = 1; currentYear++; }
            else if (currentMonth < 1) { currentMonth = 12; currentYear--; }
            document.getElementById('selectYear').value = currentYear;
            document.getElementById('selectMonth').value = currentMonth;
            updateLabels();
            renderTable();
        }

        function jumpToCurrentMonth() {
            const r = new Date();
            currentYear = r.getFullYear();
            currentMonth = r.getMonth() + 1;
            document.getElementById('selectYear').value = currentYear;
            document.getElementById('selectMonth').value = currentMonth;
            updateLabels();
            renderTable();
        }

        function updateShiftType(day, newType) {
            const ymKey = getYearMonthKey(currentYear, currentMonth);
            if (!shiftStore[ymKey]) shiftStore[ymKey] = {};
            if (newType === "未選択") delete shiftStore[ymKey][day];
            else shiftStore[ymKey][day] = newType;

            localStorage.setItem('shift_store_local_v3', JSON.stringify(shiftStore));
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('shiftTableBody');
            const filter = document.getElementById('filterType').value;
            const shifts = getMonthShifts(currentYear, currentMonth);
            tbody.innerHTML = '';
            
            shifts.forEach(item => {
                if (filter !== 'all' && item.rawType !== filter) return;
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 dark:hover:bg-slate-800/60 transition-colors";
                if (item.holiday || item.week === "日") tr.className += " bg-rose-50/50 dark:bg-rose-950/20";
                else if (item.week === "土") tr.className += " bg-sky-50/50 dark:bg-sky-950/20";

                let optionsHtml = '';
                shiftTypesList.forEach(st => {
                    optionsHtml += `<option value="${st}" ${item.rawType === st ? 'selected' : ''}>${st}</option>`;
                });

                tr.innerHTML = `
                    <td class="p-3.5 font-extrabold">${currentMonth}月 ${item.day}日</td>
                    <td class="p-3.5 text-slate-500">(${item.week})${item.holiday ? ` <span class="text-rose-600 font-bold">${item.holiday}</span>` : ''}</td>
                    <td class="p-3.5"><select onchange="updateShiftType(${item.day}, this.value)" class="text-xs font-bold px-3 py-1.5 rounded-xl border border-slate-300 dark:border-slate-700 outline-none cursor-pointer">${optionsHtml}</select></td>
                    <td class="p-3.5 font-semibold text-slate-600 dark:text-slate-300">${item.time}</td>
                `;
                tbody.appendChild(tr);
            });
            updateSummaryAndChart(getMonthShifts(currentYear, currentMonth));
        }

        function updateSummaryAndChart(shifts) {
            let workDays = 0, workHours = 0, early = 0, late = 0, night = 0, tele = 0, paid = 0, off = 0;
            let counts = { "早出社": 0, "早テレ": 0, "遅出社": 0, "遅テレ": 0, "夜出社": 0, "夜テレ": 0, "明け": 0, "休み": 0, "有休": 0, "未選択": 0 };

            shifts.forEach(s => {
                if (s.rawType === '早（出社）') { workDays++; workHours += 8; early++; counts["早出社"]++; }
                else if (s.rawType === '早（テレワーク）') { workDays++; workHours += 8; early++; tele++; counts["早テレ"]++; }
                else if (s.rawType === '遅（出社）') { workDays++; workHours += 8; late++; counts["遅出社"]++; }
                else if (s.rawType === '遅（テレワーク）') { workDays++; workHours += 8; late++; tele++; counts["遅テレ"]++; }
                else if (s.rawType === '夜（出社）') { workDays++; workHours += 10; night++; counts["夜出社"]++; }
                else if (s.rawType === '夜（テレワーク）') { workDays++; workHours += 10; night++; tele++; counts["夜テレ"]++; }
                else if (s.rawType === '明け') { counts["明け"]++; }
                else if (s.rawType === '有休') { paid++; counts["有休"]++; }
                else if (s.rawType === '休み') { off++; counts["休み"]++; }
                else { counts["未選択"]++; }
            });

            document.getElementById('statWorkDays').innerText = workDays + "日";
            document.getElementById('statWorkHours').innerText = workHours + "h";
            document.getElementById('statEarlyCount').innerText = early + "回";
            document.getElementById('statLateCount').innerText = late + "回";
            document.getElementById('statNightCount').innerText = night + "回";
            document.getElementById('statTeleworkCount').innerText = tele + "日";
            document.getElementById('statPaidLeave').innerText = paid + "日";
            document.getElementById('statOffCount').innerText = off + "日";

            const ctx = document.getElementById('shiftDonutChart').getContext('2d');
            if (donutChartInstance) donutChartInstance.destroy();
            donutChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['早(出社)', '早(テレ)', '遅(出社)', '遅(テレ)', '夜(出社)', '夜(テレ)', '明け', '休み', '有休', '未選択'],
                    datasets: [{ data: [counts["早出社"], counts["早テレ"], counts["遅出社"], counts["遅テレ"], counts["夜出社"], counts["夜テレ"], counts["明け"], counts["休み"], counts["有休"], counts["未選択"]], backgroundColor: ['#f59e0b', '#06b6d4', '#f97316', '#0ea5e9', '#4f46e5', '#6366f1', '#10b981', '#cbd5e1', '#ec4899', '#94a3b8'] }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { boxWidth: 8, font: { size: 9 } } } }, cutout: '60%' }
            });
        }

        // --- PDF Generation Modal & Logic (2-Column Layout) ---
        function openPdfModal() {
            const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
            let s = document.getElementById('pdfStartDay'), e = document.getElementById('pdfEndDay');
            s.innerHTML = ''; e.innerHTML = '';
            for (let i = 1; i <= daysInMonth; i++) {
                s.innerHTML += `<option value="${i}">${i}日</option>`;
                e.innerHTML += `<option value="${i}" ${i === daysInMonth ? 'selected' : ''}>${i}日</option>`;
            }
            document.getElementById('pdfModal').classList.remove('hidden');
        }
        function closePdfModal() { document.getElementById('pdfModal').classList.add('hidden'); }

        function generateStyledPdf() {
            const startM = parseInt(document.getElementById('pdfStartMonth').value);
            const startD = parseInt(document.getElementById('pdfStartDay').value);
            const endM = parseInt(document.getElementById('pdfEndMonth').value);
            const endD = parseInt(document.getElementById('pdfEndDay').value);
            closePdfModal();

            let targetShifts = [];
            let cursor = new Date(currentYear, startM - 1, startD);
            let endLimit = new Date(currentYear, endM - 1, endD);

            if (cursor > endLimit) {
                alert("開始日は終了日より前の日付を選択してください。");
                return;
            }

            while (cursor <= endLimit) {
                let y = cursor.getFullYear();
                let m = cursor.getMonth() + 1;
                let d = cursor.getDate();
                let monthShifts = getMonthShifts(y, m);
                let found = monthShifts.find(item => item.day === d);
                if (found) {
                    targetShifts.push(found);
                }
                cursor.setDate(cursor.getDate() + 1);
            }

            let printWin = window.open('', '_blank');
            let htmlContent = `
                <!DOCTYPE html>
                <html lang="ja">
                <head>
                    <meta charset="UTF-8">
                    <title>シフトスケジュール表 (${startM}月${startD}日 〜 ${endM}月${endD}日)</title>
                    <script src="https://cdn.tailwindcss.com"><\/script>
                    <style>
                        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans+JP:wght@500;700;900&display=swap');
                        body { font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif; background: #f8fafc; color: #0f172a; padding: 2rem; }
                        .glass { background: white; border: 1px solid #e2e8f0; border-radius: 1.5rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
                        @media print { body { background: white; padding: 0; } .no-print { display: none; } }
                    </style>
                </head>
                <body class="max-w-4xl mx-auto space-y-6">
                    <div class="no-print flex justify-between items-center bg-indigo-900 text-white p-4 rounded-2xl shadow-lg">
                        <div>
                            <h2 class="font-bold text-sm">✨ LINE共有用 2列レイアウトPDFプレビュー</h2>
                            <p class="text-xs text-indigo-200">ブラウザの印刷機能から「PDFに保存」を選択してください。</p>
                        </div>
                        <button onclick="window.print()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-5 py-2.5 rounded-xl text-xs shadow transition">🖨️ 今すぐPDF保存・印刷</button>
                    </div>

                    <div class="glass p-8 space-y-6">
                        <div class="flex justify-between items-start border-b border-slate-100 pb-6">
                            <div>
                                <span class="text-xs font-extrabold uppercase tracking-widest text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">Official Shift Schedule</span>
                                <h1 class="text-2xl font-black text-slate-900 mt-2">チーム シフトスケジュール表</h1>
                                <p class="text-xs text-slate-500 mt-1">対象期間：${currentYear}年 ${startM}月${startD}日 〜 ${endM}月${endD}日</p>
                            </div>
                            <div class="text-right">
                                <div class="text-xs font-bold text-slate-400">発行日時</div>
                                <div class="text-xs font-extrabold text-slate-700">${new Date().toLocaleDateString()}</div>
                            </div>
                        </div>

                        <!-- 2列（ハーフ）に並べるためのグリッドコンテナ -->
                        <div class="grid grid-cols-2 gap-6">
            `;

            let half = Math.ceil(targetShifts.length / 2);
            let col1 = targetShifts.slice(0, half);
            let col2 = targetShifts.slice(half);

            function buildTableRows(items) {
                let rows = '';
                items.forEach(item => {
                    let badgeStyle = "bg-slate-100 text-slate-700";
                    if (item.rawType.includes('早')) badgeStyle = "bg-amber-100 text-amber-800 border border-amber-200";
                    else if (item.rawType.includes('遅')) badgeStyle = "bg-orange-100 text-orange-800 border border-orange-200";
                    else if (item.rawType.includes('夜')) badgeStyle = "bg-indigo-100 text-indigo-800 border border-indigo-200";
                    else if (item.rawType.includes('明け')) badgeStyle = "bg-emerald-100 text-emerald-800 border border-emerald-200";
                    else if (item.rawType.includes('有休')) badgeStyle = "bg-pink-100 text-pink-800 border border-pink-200";
                    else if (item.rawType.includes('休み')) badgeStyle = "bg-slate-200 text-slate-700";
                    if (item.rawType.includes('テレワーク')) badgeStyle = "bg-cyan-100 text-cyan-800 border border-cyan-200";

                    let dayColor = "text-slate-800";
                    if (item.holiday || item.week === "日") dayColor = "text-rose-600";
                    else if (item.week === "土") dayColor = "text-sky-600";

                    rows += `
                        <tr class="hover:bg-slate-50/50 text-xs">
                            <td class="py-2.5 font-extrabold text-slate-900">${item.month}/${item.day} <span class="${dayColor}">(${item.week})</span></td>
                            <td class="py-2.5 text-center"><span class="px-2.5 py-0.5 rounded-lg font-extrabold ${badgeStyle}">${item.label}</span></td>
                            <td class="py-2.5 text-right font-bold text-slate-600">${item.time}</td>
                        </tr>
                    `;
                });
                return rows;
            }

            htmlContent += `
                <div>
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b-2 border-slate-100 text-slate-400 text-[10px] uppercase tracking-wider">
                                <th class="pb-2 font-extrabold">日付</th>
                                <th class="pb-2 font-extrabold text-center">シフト</th>
                                <th class="pb-2 font-extrabold text-right">時間</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-50 font-bold">
                            ${buildTableRows(col1)}
                        </tbody>
                    </table>
                </div>
                <div>
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b-2 border-slate-100 text-slate-400 text-[10px] uppercase tracking-wider">
                                <th class="pb-2 font-extrabold">日付</th>
                                <th class="pb-2 font-extrabold text-center">シフト</th>
                                <th class="pb-2 font-extrabold text-right">時間</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-50 font-bold">
                            ${buildTableRows(col2)}
                        </tbody>
                    </table>
                </div>
            `;

            htmlContent += `
                        </div>

                        <div class="border-t border-slate-100 pt-4 text-center text-[10px] text-slate-400 font-medium">
                            Shift Sync Dashboard Pro — Generated for Team Collaboration via LINE
                        </div>
                    </div>
                </body>
                </html>
            `;
            printWin.document.write(htmlContent);
            printWin.document.close();
        }

        // --- CSV Export Modal & Logic ---
        function openCsvModal() {
            const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
            let s = document.getElementById('csvStartDay'), e = document.getElementById('csvEndDay');
            s.innerHTML = ''; e.innerHTML = '';
            for (let i = 1; i <= daysInMonth; i++) {
                s.innerHTML += `<option value="${i}">${i}日</option>`;
                e.innerHTML += `<option value="${i}" ${i === daysInMonth ? 'selected' : ''}>${i}日</option>`;
            }
            document.getElementById('csvModal').classList.remove('hidden');
        }
        function closeCsvModal() { document.getElementById('csvModal').classList.add('hidden'); }

        function executeCsvExport() {
            const startDay = parseInt(document.getElementById('csvStartDay').value);
            const endDay = parseInt(document.getElementById('csvEndDay').value);
            const excludeOff = document.getElementById('csvExcludeOff').checked;
            const shifts = getMonthShifts(currentYear, currentMonth).filter(item => item.day >= startDay && item.day <= endDay && item.rawType !== '未選択' && !(excludeOff && (item.rawType.includes('休み') || item.rawType.includes('有休'))));
            
            if (shifts.length === 0) { alert("対象シフトがありません。"); return; }
            let csv = "\uFEFFSubject,Start Date,All Day Event,Description\r\n";
            shifts.forEach(i => { csv += `"[シフト] ${i.label} (${i.time})",${currentYear}/${String(currentMonth).padStart(2,'0')}/${String(i.day).padStart(2,'0')},True,"Local Sync CSV"\r\n`; });
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `shift_${currentYear}_${currentMonth}.csv`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            closeCsvModal();
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            document.getElementById('themeIcon').className = document.documentElement.classList.contains('dark') ? "fa-solid fa-sun" : "fa-solid fa-moon";
        }

        window.onload = function() {
            document.getElementById('selectYear').value = currentYear;
            document.getElementById('selectMonth').value = currentMonth;
            updateLabels();
            renderTable();
        };
    </script>
</body>
</html>
